name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Descomprimir proyecto
        run: unzip -q "$(ls *.zip | head -1)"
      - name: Compilar
        working-directory: Jarvis
        run: gradle assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp Jarvis/app/build/outputs/apk/debug/app-debug.apk Jarvis/Clithel.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Clithel v${{ github.run_number }}
          files: Jarvis/Clithel.apk
